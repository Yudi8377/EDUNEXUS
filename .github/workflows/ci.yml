name: EDUNEXUS CI

on:
  push:
    branches: ["main", "engineering/**"]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: cat pnpm-lock.yaml
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
