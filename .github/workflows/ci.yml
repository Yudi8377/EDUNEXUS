name: EDUNEXUS CI

on:
  push:
    branches: ["main", "engineering/**"]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Cloudflare build toolchain for typecheck and build
        working-directory: apps/web
        run: |
          pnpm add --save-dev --no-save @opennextjs/cloudflare@1.20.6 wrangler@4.135.0
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build portable Next.js runtime
        run: pnpm --filter @edunexus/web build
      - name: Verify standalone runtime contract
        run: |
          test -f apps/web/.next/standalone/apps/web/server.js
          test -d apps/web/.next/standalone/node_modules
          test -d apps/web/.next/static
